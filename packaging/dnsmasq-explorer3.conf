# Explorer 3: captive portal of the Explorer3 network (the game's access
# point, 192.168.4.1). NetworkManager starts dnsmasq with this folder for its
# shared connections: every name is answered with the Pi's address, so that a
# phone joining Explorer3 opens the game's page by itself (as the Cardputer
# does). Removed with the package.
address=/#/192.168.4.1
