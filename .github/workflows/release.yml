# Each version tag (v...): the .deb for Raspberry Pi OS 64-bit (arm64) and
# 32-bit (armhf), built on Debian 12 "Bookworm" (so they also run on Debian 13
# "Trixie"), attached to the GitHub release.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deb:
    runs-on: ubuntu-24.04
    container: debian:bookworm
    strategy:
      matrix:
        include:
          - arch: arm64
            triplet: aarch64-linux-gnu
          - arch: armhf
            triplet: arm-linux-gnueabihf
    steps:
      - name: Tools
        run: |
          dpkg --add-architecture ${{ matrix.arch }}
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates curl make pkg-config \
            crossbuild-essential-${{ matrix.arch }} libsdl2-dev:${{ matrix.arch }}
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sources of the game and M5GFX
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          sh tools/fetch-deps.sh
      - name: Build
        run: |
          make -j"$(nproc)" deb CROSS=${{ matrix.triplet }}- \
            PKG_CONFIG="env PKG_CONFIG_LIBDIR=/usr/lib/${{ matrix.triplet }}/pkgconfig:/usr/share/pkgconfig pkg-config"
      - uses: actions/upload-artifact@v4
        with:
          name: explorer3-${{ matrix.arch }}
          path: dist/*.deb
      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.deb
